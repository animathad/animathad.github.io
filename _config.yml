# ============================================================
#  Anirudh Mathad — personal site
#  Built on the Jekyll-Garden theme (MIT). Restart `jekyll serve`
#  after editing this file; it is not reloaded automatically.
# ============================================================

# Base hostname & protocol. For a user GitHub Pages site this is
# https://<username>.github.io  with an empty baseurl.
url: "https://animathad.github.io"
baseurl: ""

# Identity shown across the site
heading: Anirudh Mathad
tagline: Engineering leader at Adobe, building AI factories for 15,000 developers.
description: >-
  Anirudh Mathad — engineering leader at Adobe. Essays and working notes on
  AI, developer platforms, and the systems that scale them.

author:
  name: Anirudh Mathad

# Social handles (used by Nav, Homepage, Footer)
social:
  linkedin: anirudhham
  github: animathad

copyright:
  msg: Words are my own.

# Private / broken wiki-link tooltip
privatelinks:
  title: Private or unpublished
  msg: This note isn't published yet.

# Theme feature toggles
preferences:
  search:
    enabled: true
  wiki_style_link:
    enabled: true
  pagepreview:
    enabled: true
  backlinks:
    enabled: true
  homepage:
    enabled: true  # renders _includes/Homepage.html at "/"

encoding: utf-8
timezone: America/Los_Angeles

# Build settings
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  notes:
    output: true
    permalink: /note/:title

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter: rouge

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: Post
      permalink: /post/:title
      content-type: post
  - scope:
      path: ""
      type: notes
    values:
      layout: Post
      content-type: notes

# Exclude from processing
exclude:
  - _notes/000 Inbox
  - _notes/200 Private
  - _notes/300 Templates
  - Dockerfile
  - docker-compose.yml
  - debug.yml
  - README.md
  - LICENSE
  - blog.code-workspace
  - utilities
  - vendor
  - .bundle
