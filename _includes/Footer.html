{%- comment -%} Site footer. {%- endcomment -%}
<footer class="site-footer">
    <div class="site-footer__meta">
        © {{ 'now' | date: "%Y" }} {{ site.author.name }}{% if site.copyright.msg %} · {{ site.copyright.msg }}{% endif %}
    </div>
    <div class="site-footer__links">
        <a href="{{ '/posts' | relative_url }}">Blog</a>
        <a href="{{ '/notes' | relative_url }}">Garden</a>
        <a href="{{ '/about' | relative_url }}">About</a>
        {%- if site.social.linkedin -%}<a href="https://www.linkedin.com/in/{{ site.social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{%- endif -%}
        {%- if site.social.github -%}<a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>{%- endif -%}
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
</footer>
